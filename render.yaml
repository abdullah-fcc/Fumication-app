services:
  - type: web
    name: insta-fumigation-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w @insta-fumigation/api
    startCommand: npm run start -w @insta-fumigation/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
